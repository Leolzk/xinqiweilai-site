<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>芯启蔚来生物科技</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "SimSun", "宋体", "Songti SC", "STSong", serif;
            background: #000;
        }

        /* 背景图层 - 类器官显微镜图像 */
        .bg-layer {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('organoid_bg.jpg');
            background-size: cover;
            background-position: center;
            animation: breathe 12s ease-in-out infinite;
            filter: brightness(0.55) contrast(1.1) saturate(1.15);
            z-index: 0;
        }

        /* 类器官呼吸脉动 - 模拟活体组织节律性胀缩 */
        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                filter: brightness(0.55) contrast(1.1) saturate(1.15);
            }
            50% {
                transform: scale(1.04);
                filter: brightness(0.62) contrast(1.05) saturate(1.2);
            }
        }

        /* 暗色遮罩 - 保证文字可读性 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                rgba(0, 8, 20, 0.3) 0%,
                rgba(0, 5, 15, 0.6) 40%,
                rgba(0, 3, 10, 0.85) 70%,
                rgba(0, 2, 8, 0.95) 100%
            );
            z-index: 1;
        }

        /* 荧光脉冲层 - 模拟荧光通道信号闪烁 */
        .fluorescence-pulse {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            animation: fluoPulse 8s ease-in-out infinite;
        }

        @keyframes fluoPulse {
            0%, 100% {
                background: radial-gradient(
                    ellipse at 45% 50%,
                    rgba(0, 200, 120, 0.03) 0%,
                    transparent 50%
                );
            }
            33% {
                background: radial-gradient(
                    ellipse at 55% 45%,
                    rgba(200, 50, 80, 0.04) 0%,
                    transparent 45%
                );
            }
            66% {
                background: radial-gradient(
                    ellipse at 50% 55%,
                    rgba(60, 180, 220, 0.03) 0%,
                    transparent 50%
                );
            }
        }

        /* 浮动细胞粒子 - 模拟培养基中的游离细胞 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .cell {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: floatCell linear infinite;
        }

        /* 不同类型细胞粒子 */
        .cell-type-1 {
            background: radial-gradient(circle at 35% 35%, rgba(0, 210, 130, 0.5), rgba(0, 160, 100, 0.15), transparent);
            box-shadow: 0 0 4px rgba(0, 210, 130, 0.2);
        }
        .cell-type-2 {
            background: radial-gradient(circle at 35% 35%, rgba(220, 60, 90, 0.45), rgba(180, 40, 70, 0.12), transparent);
            box-shadow: 0 0 4px rgba(220, 60, 90, 0.18);
        }
        .cell-type-3 {
            background: radial-gradient(circle at 35% 35%, rgba(80, 190, 230, 0.4), rgba(50, 150, 200, 0.1), transparent);
            box-shadow: 0 0 3px rgba(80, 190, 230, 0.15);
        }
        .cell-type-4 {
            background: radial-gradient(circle at 40% 40%, rgba(255, 220, 100, 0.35), rgba(220, 180, 60, 0.08), transparent);
            box-shadow: 0 0 3px rgba(255, 220, 100, 0.12);
        }

        @keyframes floatCell {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0) scale(0.5);
            }
            10% {
                opacity: 0.7;
                transform: scale(1);
            }
            90% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) translateX(30px) scale(0.6);
            }
        }

        /* 主文字容器 */
        .content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .main-text {
            font-family: "SimSun", "宋体", "Songti SC", "STSong", serif;
            font-size: clamp(22px, 3.5vw, 42px);
            color: rgba(220, 235, 245, 0.92);
            letter-spacing: 0.15em;
            text-align: center;
            line-height: 1.8;
            text-shadow:
                0 0 20px rgba(0, 180, 160, 0.25),
                0 0 60px rgba(0, 120, 140, 0.1),
                0 2px 8px rgba(0, 0, 0, 0.5);
            animation: textFadeIn 3s ease-out forwards;
            padding: 0 20px;
        }

        @keyframes textFadeIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 底部微标 */
        .footer-line {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            font-family: "SimSun", "宋体", "Songti SC", "STSong", serif;
            font-size: 12px;
            color: rgba(140, 160, 170, 0.35);
            letter-spacing: 0.08em;
            animation: textFadeIn 4s ease-out forwards;
        }

        /* 扫描线效果 - 模拟显微镜扫描成像 */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 10, 20, 0.03) 2px,
                rgba(0, 10, 20, 0.03) 4px
            );
        }

        /* 渐晕效果 - 模拟显微镜视场 */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 50%,
                rgba(0, 2, 8, 0.4) 75%,
                rgba(0, 1, 5, 0.7) 90%,
                rgba(0, 0, 3, 0.9) 100%
            );
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .main-text {
                font-size: 20px;
                letter-spacing: 0.1em;
            }
        }
    </style>
</head>
<body>
    <!-- 背景图层 -->
    <div class="bg-layer"></div>

    <!-- 暗色遮罩 -->
    <div class="overlay"></div>

    <!-- 荧光脉冲 -->
    <div class="fluorescence-pulse"></div>

    <!-- 扫描线 -->
    <div class="scanline"></div>

    <!-- 渐晕 -->
    <div class="vignette"></div>

    <!-- 浮动细胞粒子 -->
    <div class="particles" id="particles"></div>

    <!-- 主内容 -->
    <div class="content">
        <div class="main-text">网站正在升级，敬请期待……</div>
    </div>

    <!-- 底部 -->
    <div class="footer-line">芯启蔚来生物科技（上海）有限公司</div>

    <script>
        // 生成浮动细胞粒子 - 模拟培养基中游离细胞
        // 粒子参数基于真实类器官培养基中的细胞密度与运动特征
        const particlesContainer = document.getElementById('particles');
        const cellTypes = ['cell-type-1', 'cell-type-2', 'cell-type-3', 'cell-type-4'];
        // 绿色(E-cadherin荧光)、红色(Ki67/增殖)、蓝色(DAPI核染)、黄色(自发荧光)

        function createCell() {
            const cell = document.createElement('div');
            cell.className = 'cell ' + cellTypes[Math.floor(Math.random() * cellTypes.length)];

            // 细胞直径3-12px, 对应显微镜下5-20μm尺度
            const size = 3 + Math.random() * 9;
            cell.style.width = size + 'px';
            cell.style.height = size + 'px';

            // 随机起始位置
            cell.style.left = Math.random() * 100 + '%';
            cell.style.top = 100 + Math.random() * 20 + '%';

            // 运动持续时间15-35秒, 模拟培养基中细胞缓慢沉降
            const duration = 15 + Math.random() * 20;
            cell.style.animationDuration = duration + 's';
            cell.style.animationDelay = Math.random() * 5 + 's';

            particlesContainer.appendChild(cell);

            // 动画结束后移除并创建新细胞
            setTimeout(() => {
                cell.remove();
                createCell();
            }, (duration + 5) * 1000);
        }

        // 初始生成25个细胞粒子, 维持中等密度
        for (let i = 0; i < 25; i++) {
            setTimeout(() => createCell(), Math.random() * 8000);
        }
    </script>
</body>
</html>
